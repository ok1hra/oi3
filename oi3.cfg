[NET_ID=02] for TrxNet if set 0x00 TrxNet disable
[YOUR_CALL=OK1HRA]
[InterlockEnable=1] 1 = interlock, 0 = ptt in
[SEQUENCERlead=0] (ms) rear RCA
[SEQUENCERtail=0]
[PAlead=10] rear RCA + pin7-DB25
[PAtail=0]
[PTTlead=10] by mode, see below
[PTTtail=10]
[PTTmodeLSB=3]     CI-V 0x00 -> PTT3 (MIC)
[PTTmodeUSB=3]     CI-V 0x01 -> PTT3 (MIC)
[PTTmodeAM=3]      CI-V 0x02 -> PTT3 (MIC)
[PTTmodeCW=3]      CI-V 0x03 -> PTT3 (MIC)
[PTTmodeRTTY=1]    CI-V 0x04 -> PTT1 (REM/FSK)
[PTTmodeFM=3]      CI-V 0x05 -> PTT3 (MIC)
[PTTmodeCWR=3]     CI-V 0x07 -> PTT3 (MIC)
[PTTmodeRTR=1]     CI-V 0x08 -> PTT1 (REM/FSK)
[PTTmodeDefault=3] fallback when CI-V mode unknown / link down
[BAND_DECODER_IN=1] 0=disable | 1=ICOM_CIV
[SERBAUD2=9600] band decoder CAT baudrate
[CIV_ADRESS=98] 56=IC746, 98=IC7610 for Icom in HEX format
[CIV_CW_VIA_CIV=0] RESERVED - not yet implemented; CW is always keyed locally via CW1/CW2 + sequencer
[EthernetEnable=1]
[EthernetDHCP=1] 1 = DHCP, 0 = static (defaults: 192.168.1.220 / .1 / 255.255.255.0 / 8.8.8.8)
[UdpPort=5683] TrxNet UDP port 1..65535; change to isolate independent networks on one LAN; needs reset
[KeyerDefaultWpm=28]      keyer WPM 5..50 (EEPROM may override)
[KeyerMode=B]             iambic mode A or B
[KeyerPaddleReverse=0]    0 = PADDLEL is dit, 1 = swap
[KeyerSidetoneHz=600]     0 = off, otherwise 300..1200 Hz
[KeyerRttyBaud=45]        45 / 50 / 75 / 100 (45 => 45.45 Bd)
[KeyerFskReverse=0]       FSK polarity: 0 = MARK=HIGH/SPACE=LOW, 1 = inverted
[TunePower=20]            MODE btn (CI-V on) low-power tune level [%] via CI-V 14 0A
[TuneRestoreFallback=100] power [%] restored if the start read of power fails
[TuneHoldMs=1000]         min carrier duration even on a quick tap; hold longer keeps keying
[TuneMaxMs=30000]         hard cap on carrier duration (stuck-button safety)
[TuneSettleMs=80]         delay after set mode+power before PTT up
[TuneReadTimeoutMs=300]   per-attempt timeout of the power read (2 retries)
[TuneKeepaliveMs=2500]    TrxNet /s-lptune tune: carrier drops when no keepalive arrives this long
[RkeyEnable=0]            remote CW key server (Paddle2IP -> OI3 over UDP): 1 = on
[RkeyPort=5690]           UDP port of the remote CW key stream
[RkeyKey=00000000000000000000000000000000] 128-bit shared key, 32 hex chars, same as in Paddle2IP; CHANGE IT
[RkeyDelayMs=120]         playout delay; LAN 30, good internet 80-150, LTE 200+ (Paddle2IP may override)
[RkeyLinkTimeoutMs=300]   key-down without packets this long -> key up + abort
[RkeyMaxDownMs=3000]      longest single key-down accepted from remote
[RkeyRequireCiv=1]        1 = key only when CI-V reports CW/CWR, 0 = also local MODE fallback
[PriorityPrefixes=705 ANT ROT PA] keep these peers when table full; space-sep, max 6 x 7 chars, prefix-matched from start of device name (705.01/ANT.01/ROT.1); empty = off
